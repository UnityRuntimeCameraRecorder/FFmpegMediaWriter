name: Snapshot build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: .NET Standard 2.0 / AnyCPU
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build managed DLL
        run: |
          New-Item -ItemType Directory -Path obj -Force | Out-Null
          dotnet build FFmpegMediaWriter.csproj -c Release -v minimal /fl '/flp:logfile=obj/snapshot-build.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE."
          }

      - name: Package snapshot
        run: |
          $snapshot = 'bin/snapshot'
          New-Item -ItemType Directory -Path $snapshot -Force | Out-Null
          Copy-Item -LiteralPath 'bin/Release/netstandard2.0/FFmpegMediaWriter.dll' -Destination $snapshot
          Copy-Item -LiteralPath 'LICENSE', 'README.md' -Destination $snapshot
          $dll = Get-Item -LiteralPath "$snapshot/FFmpegMediaWriter.dll"
          if ($dll.Length -eq 0) {
            throw 'The compiled DLL is empty.'
          }
          [ordered]@{
            kind = 'snapshot'
            commit = (git rev-parse HEAD)
            run = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            builtUtc = [DateTime]::UtcNow.ToString('O')
            framework = '.NET Standard 2.0'
            platform = 'AnyCPU'
            configuration = 'Release'
            dllSha256 = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath "$snapshot/build-info.json" -Encoding utf8
          Compress-Archive -Path "$snapshot/*" -DestinationPath 'bin/FFmpegMediaWriter-1.0.0-snapshot.zip' -Force

      - name: Upload snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FFmpegMediaWriter-snapshot-netstandard2.0-anycpu-${{ github.sha }}-${{ github.run_attempt }}
          path: bin/snapshot/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FFmpegMediaWriter-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: obj/snapshot-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish snapshot prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: 1.0.0-snapshot
        run: |
          $tagReference = "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:SNAPSHOT_TAG"
          gh api --method PATCH $tagReference -f sha="$env:GITHUB_SHA" -F force=true 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:SNAPSHOT_TAG" -f sha="$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to update the snapshot tag.'
          }
          gh release view $env:SNAPSHOT_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:SNAPSHOT_TAG --title $env:SNAPSHOT_TAG --prerelease --notes 'Latest automatic snapshot from the main branch.'
          } else {
            gh release create $env:SNAPSHOT_TAG --title $env:SNAPSHOT_TAG --prerelease --notes 'Latest automatic snapshot from the main branch.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to create or update the snapshot prerelease.'
          }
          foreach ($asset in (gh release view $env:SNAPSHOT_TAG --json assets --jq '.assets[].name')) {
            gh release delete-asset $env:SNAPSHOT_TAG $asset --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to delete previous snapshot asset: $asset"
            }
          }
          gh release upload $env:SNAPSHOT_TAG 'bin/FFmpegMediaWriter-1.0.0-snapshot.zip' --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to upload the snapshot archive.'
          }
